# Temporary: proof for the Oxlint switch. Removed before merge.
name: temp-oxlint-proof
on: [push, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --version
      - run: npm run lint
      - name: Planted rules-of-hooks error must fail lint
        run: |
          printf 'import { useState } from "react";\nexport function Bad({ x }: { x: boolean }) {\n  if (x) { const [a] = useState(0); return <p>{a}</p>; }\n  return null;\n}\n' > src/planted.tsx
          if npm run lint; then echo "lint did not catch planted error"; exit 1; fi
          rm src/planted.tsx
      - run: npm run lint
      - run: npm run build
